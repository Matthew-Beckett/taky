name: Docker PR Image

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'taky/**'
      - 'pyproject.toml'
      - 'uv.lock'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v7

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
      with:
        platforms: all

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.IMAGE }}
        flavor: latest=false
        tags: |
          type=ref,event=pr
          type=sha,format=short

    # Fork PRs receive a read-only GITHUB_TOKEN and cannot push to GHCR;
    # for them this workflow is a build-only check.
    - name: Login to GHCR
      if: github.event.pull_request.head.repo.full_name == github.repository
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: ${{ env.PLATFORMS }}
        push: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          SETUPTOOLS_SCM_PRETEND_VERSION=0.0.0.dev${{ github.event.pull_request.number }}
