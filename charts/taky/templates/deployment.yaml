apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "taky.fullname" . }}
  labels:
    {{- include "taky.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "taky.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "taky.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "taky.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: init-data
          image: {{ include "taky.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Runs as root: provisioned volumes mount root-owned, and the
          # taky user (uid 100) needs /var/taky writable for the mgmt
          # socket and datapackage uploads.
          securityContext:
            runAsUser: 0
          command: ["sh", "-c", "mkdir -p /var/taky/dp-user && chown -R taky:taky /var/taky"]
          volumeMounts:
            - name: data
              mountPath: /var/taky
        {{- if .Values.ssl.enabled }}
        - name: init-certs
          image: {{ include "taky.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - python
            - -c
            - |
              import os
              from taky.config import load_config
              from taky.util import anc
              load_config("/etc/taky/taky.conf")
              ssl_dir = "/var/taky/ssl"
              os.makedirs(ssl_dir, exist_ok=True)
              {{- if not .Values.ssl.secretName }}
              import base64
              import json
              import ssl as tls
              import urllib.error
              import urllib.request

              keys = ["ca.crt", "ca.key", "server.crt", "server.key", "server.p12"]
              secret_name = {{ printf "%s-ssl" (include "taky.fullname" .) | quote }}

              sa_dir = "/var/run/secrets/kubernetes.io/serviceaccount"
              with open(f"{sa_dir}/namespace", encoding="utf8") as fp:
                  namespace = fp.read().strip()
              with open(f"{sa_dir}/token", encoding="utf8") as fp:
                  token = fp.read().strip()
              ctx = tls.create_default_context(cafile=f"{sa_dir}/ca.crt")

              def api(method, path, body=None):
                  req = urllib.request.Request(
                      f"https://kubernetes.default.svc{path}",
                      data=json.dumps(body).encode() if body is not None else None,
                      method=method,
                      headers={"Authorization": f"Bearer {token}"},
                  )
                  if body is not None:
                      req.add_header("Content-Type", "application/json")
                  try:
                      with urllib.request.urlopen(req, context=ctx) as resp:
                          return json.load(resp)
                  except urllib.error.HTTPError as exc:
                      if exc.code == 404:
                          return None
                      raise

              secret = api(
                  "GET", f"/api/v1/namespaces/{namespace}/secrets/{secret_name}"
              )
              secret_data = (secret or {}).get("data") or {}

              # The Secret outlives the PVC: if the volume was re-created
              # empty, restore the CA and server certificate from it so
              # existing client datapackages keep working.
              if not os.path.exists(f"{ssl_dir}/ca.crt") and all(
                  k in secret_data for k in keys
              ):
                  for k in keys:
                      with open(os.path.join(ssl_dir, k), "wb") as fp:
                          fp.write(base64.b64decode(secret_data[k]))
                  crt, _ = anc.load_certificate(
                      f"{ssl_dir}/server.crt", f"{ssl_dir}/server.key"
                  )
                  anc.CertificateDatabase().add_certificate(crt)

              ca, ca_key = f"{ssl_dir}/ca.crt", f"{ssl_dir}/ca.key"
              if not os.path.exists(ca):
                  anc.make_ca(ca, ca_key)
              if not os.path.exists(f"{ssl_dir}/server.crt"):
                  cert = anc.make_cert(
                      path=ssl_dir,
                      f_name="server",
                      hostname={{ .Values.config.publicIp | default .Values.config.hostname | quote }},
                      cert_pw="atakatak",
                      cert_auth=(ca, ca_key),
                      dump_pem=True,
                      key_in_pem=False,
                      is_server_cert=True,
                  )
                  anc.CertificateDatabase().add_certificate(cert)

              if secret is None:
                  api("POST", f"/api/v1/namespaces/{namespace}/secrets", {
                      "apiVersion": "v1",
                      "kind": "Secret",
                      "metadata": {
                          "name": secret_name,
                          "labels": {
                              "app.kubernetes.io/name": {{ include "taky.name" . | quote }},
                              "app.kubernetes.io/instance": {{ .Release.Name | quote }},
                              "app.kubernetes.io/managed-by": {{ .Release.Service | quote }},
                          },
                      },
                      "type": "Opaque",
                      "data": {
                          k: base64.b64encode(
                              open(os.path.join(ssl_dir, k), "rb").read()
                          ).decode()
                          for k in keys
                      },
                  })
              {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/taky/taky.conf
              subPath: taky.conf
              readOnly: true
            - name: data
              mountPath: /var/taky
        {{- end }}
      containers:
        - name: cot
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "taky.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: cot
              containerPort: {{ include "taky.cotPort" . }}
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: cot
          readinessProbe:
            tcpSocket:
              port: cot
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/taky/taky.conf
              subPath: taky.conf
              readOnly: true
            - name: data
              mountPath: /var/taky
            {{- if .Values.ssl.secretName }}
            - name: ssl
              mountPath: /etc/taky/ssl
              readOnly: true
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        - name: dps
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "taky.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["taky_dps"]
          ports:
            - name: dps
              containerPort: {{ include "taky.dpsPort" . }}
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: dps
          readinessProbe:
            tcpSocket:
              port: dps
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/taky/taky.conf
              subPath: taky.conf
              readOnly: true
            - name: data
              mountPath: /var/taky
            {{- if .Values.ssl.secretName }}
            - name: ssl
              mountPath: /etc/taky/ssl
              readOnly: true
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "taky.fullname" . }}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "taky.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.ssl.secretName }}
        - name: ssl
          secret:
            secretName: {{ .Values.ssl.secretName }}
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
