apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "taky.fullname" . }}
  labels:
    {{- include "taky.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "taky.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "taky.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: init-data
          image: {{ include "taky.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Runs as root: provisioned volumes mount root-owned, and the
          # taky user (uid 100) needs /var/taky writable for the mgmt
          # socket and datapackage uploads.
          securityContext:
            runAsUser: 0
          command: ["sh", "-c", "mkdir -p /var/taky/dp-user && chown -R taky:taky /var/taky"]
          volumeMounts:
            - name: data
              mountPath: /var/taky
        {{- if .Values.ssl.enabled }}
        - name: init-certs
          image: {{ include "taky.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - python
            - -c
            - |
              import os
              from taky.config import load_config
              from taky.util import anc
              load_config("/etc/taky/taky.conf")
              ssl_dir = "/var/taky/ssl"
              os.makedirs(ssl_dir, exist_ok=True)
              {{- if not .Values.ssl.secretName }}
              ca, ca_key = f"{ssl_dir}/ca.crt", f"{ssl_dir}/ca.key"
              if not os.path.exists(ca):
                  anc.make_ca(ca, ca_key)
              if not os.path.exists(f"{ssl_dir}/server.crt"):
                  cert = anc.make_cert(
                      path=ssl_dir,
                      f_name="server",
                      hostname={{ .Values.config.publicIp | default .Values.config.hostname | quote }},
                      cert_pw="atakatak",
                      cert_auth=(ca, ca_key),
                      dump_pem=True,
                      key_in_pem=False,
                      is_server_cert=True,
                  )
                  anc.CertificateDatabase().add_certificate(cert)
              {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/taky/taky.conf
              subPath: taky.conf
              readOnly: true
            - name: data
              mountPath: /var/taky
        {{- end }}
      containers:
        - name: cot
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "taky.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: cot
              containerPort: {{ include "taky.cotPort" . }}
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: cot
          readinessProbe:
            tcpSocket:
              port: cot
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/taky/taky.conf
              subPath: taky.conf
              readOnly: true
            - name: data
              mountPath: /var/taky
            {{- if .Values.ssl.secretName }}
            - name: ssl
              mountPath: /etc/taky/ssl
              readOnly: true
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        - name: dps
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "taky.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["taky_dps"]
          ports:
            - name: dps
              containerPort: {{ include "taky.dpsPort" . }}
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: dps
          readinessProbe:
            tcpSocket:
              port: dps
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/taky/taky.conf
              subPath: taky.conf
              readOnly: true
            - name: data
              mountPath: /var/taky
            {{- if .Values.ssl.secretName }}
            - name: ssl
              mountPath: /etc/taky/ssl
              readOnly: true
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "taky.fullname" . }}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "taky.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.ssl.secretName }}
        - name: ssl
          secret:
            secretName: {{ .Values.ssl.secretName }}
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
