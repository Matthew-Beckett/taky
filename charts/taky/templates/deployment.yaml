apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "taky.fullname" . }}
  labels:
    {{- include "taky.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "taky.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "taky.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: init-data
          image: {{ include "taky.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c", "mkdir -p /var/taky/dp-user"]
          volumeMounts:
            - name: data
              mountPath: /var/taky
      containers:
        - name: cot
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "taky.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: cot
              containerPort: {{ include "taky.cotPort" . }}
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: cot
          readinessProbe:
            tcpSocket:
              port: cot
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/taky/taky.conf
              subPath: taky.conf
              readOnly: true
            - name: data
              mountPath: /var/taky
            {{- if .Values.ssl.enabled }}
            - name: ssl
              mountPath: /etc/taky/ssl
              readOnly: true
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        - name: dps
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "taky.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["taky_dps"]
          ports:
            - name: dps
              containerPort: {{ include "taky.dpsPort" . }}
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: dps
          readinessProbe:
            tcpSocket:
              port: dps
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/taky/taky.conf
              subPath: taky.conf
              readOnly: true
            - name: data
              mountPath: /var/taky
            {{- if .Values.ssl.enabled }}
            - name: ssl
              mountPath: /etc/taky/ssl
              readOnly: true
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "taky.fullname" . }}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "taky.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.ssl.enabled }}
        - name: ssl
          secret:
            secretName: {{ required "ssl.secretName is required when ssl.enabled=true" .Values.ssl.secretName }}
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
