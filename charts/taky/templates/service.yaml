apiVersion: v1
kind: Service
metadata:
  name: {{ include "taky.fullname" . }}
  labels:
    {{- include "taky.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: cot
      port: {{ include "taky.cotPort" . }}
      targetPort: cot
      protocol: TCP
    - name: dps
      port: {{ include "taky.dpsPort" . }}
      targetPort: dps
      protocol: TCP
  selector:
    {{- include "taky.selectorLabels" . | nindent 4 }}
